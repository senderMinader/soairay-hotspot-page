<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />   
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<title>Deconnexion</title>
<link rel="stylesheet" href="css/style.css">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<script>
    function openLogin() {
	if (window.name != 'hotspot_logout') return true;
	open('$(link-login)', '_blank', '');
	window.close();
	return false;
    }
</script>
</head>

<body>
    <div class="ie-fixMinHeight">
        <div class="main">
            <div class="wrap login-card">
                <h1>Vous êtes deconnecté!</h1> 
                <table>  
                    <tr><td>Nom d'utilisateur</td><td>$(username)</td></tr>
                    <tr><td>Adresse IP</td><td>$(ip)</td></tr>
                    <tr><td>Adresse MAC</td><td>$(mac)</td></tr>
                    <tr><td>Durée de session</td><td>$(uptime)</td></tr>
                    $(if session-time-left)
                    <tr><td>Temps restant</td><td>$(session-time-left)</td></tr>
                    $(endif)
                    <tr><td>Données envoyées / reçues:</td><td>$(bytes-in-nice) / $(bytes-out-nice)</td></tr>
                </table>


                <form action="$(link-login)" name="login" onSubmit="return openLogin()">
                <input type="submit" role="button" class="soft-ui-button" value="Se reconnecter">
                </form>
            </div>
        </div>
    </div>

</body>
</html>
